appId: com.truedrawing.app
productName: True Drawing
asar: true
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - config/**
  - package.json
win:
  target:
    - nsis
  artifactName: True-Drawing-${version}-Windows-${arch}.${ext}
mac:
  target:
    - dmg
    - zip
  artifactName: True-Drawing-${version}-macOS-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

