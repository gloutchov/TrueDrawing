name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to package and publish, for example v1.0.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify required project documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            ISTRUZIONI.md
            INSTRUCTIONS.md
            SECURITY_MODEL.md
            AGENTS.md
            MAP.md
            PLAN.md
            VERSION
            config/app.config.json
          )
          for file in "${required[@]}"; do
            test -s "$file"
          done

      - name: Verify version and tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "$(cat VERSION)" = "$package_version"
          test "$RELEASE_TAG" = "v${package_version}"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  create-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          repository="${GITHUB_REPOSITORY}"
          notes_path="docs/release-notes/${tag}.md"
          if [[ -f "$notes_path" ]]; then
            notes_args=(--notes-file "$notes_path")
          else
            notes_args=(--notes "Unsigned Windows/macOS release for ${tag}. Windows SmartScreen and macOS Gatekeeper may show warnings on first launch.")
          fi
          if gh release view "$tag" --repo "$repository" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repository" --title "$tag" "${notes_args[@]}" --latest
          else
            gh release create "$tag" --repo "$repository" --title "$tag" "${notes_args[@]}" --latest
          fi

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Package Windows
        run: npm run dist:win

      - name: Generate Windows checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum True-Drawing-* latest.yml > SHA256SUMS-windows.txt

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          repository="${GITHUB_REPOSITORY}"
          while IFS= read -r -d '' file; do
            gh release upload "$tag" "$file" --repo "$repository" --clobber
          done < <(find release -maxdepth 1 -type f ! -name "builder-debug.yml" -print0)

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Package macOS
        run: npm run dist:mac

      - name: Generate macOS checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 True-Drawing-* latest-mac.yml > SHA256SUMS-macos.txt

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          repository="${GITHUB_REPOSITORY}"
          while IFS= read -r -d '' file; do
            gh release upload "$tag" "$file" --repo "$repository" --clobber
          done < <(find release -maxdepth 1 -type f ! -name "builder-debug.yml" -print0)
