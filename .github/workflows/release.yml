name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to package and publish, for example v1.0.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Package Windows
        run: npm run dist:win

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          repository="${GITHUB_REPOSITORY}"
          if ! gh release view "$tag" --repo "$repository" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repository" --title "$tag" --notes "Automated release for $tag." || gh release view "$tag" --repo "$repository" >/dev/null
          fi
          while IFS= read -r -d '' file; do
            gh release upload "$tag" "$file" --repo "$repository" --clobber
          done < <(find release -maxdepth 1 -type f ! -name "builder-debug.yml" -print0)

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Package macOS
        run: npm run dist:mac

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          repository="${GITHUB_REPOSITORY}"
          if ! gh release view "$tag" --repo "$repository" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repository" --title "$tag" --notes "Automated release for $tag." || gh release view "$tag" --repo "$repository" >/dev/null
          fi
          while IFS= read -r -d '' file; do
            gh release upload "$tag" "$file" --repo "$repository" --clobber
          done < <(find release -maxdepth 1 -type f ! -name "builder-debug.yml" -print0)
