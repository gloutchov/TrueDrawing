name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  bootstrap:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Verify required project documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            ISTRUZIONI.md
            INSTRUCTION.md
            SECURITY_MODEL.md
            AGENTS.md
            MAP.md
            PLAN.md
            VERSION
            config/app.config.json
          )
          for file in "${required[@]}"; do
            test -s "$file"
          done

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.1.0"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
