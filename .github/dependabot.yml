version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8 supports TypeScript <6.1; review this when upgrading it.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      development:
        dependency-type: development
